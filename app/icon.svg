<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fundo Escuro Confortável (Mantém a consistência com o tema do site) -->
  <rect width="512" height="512" rx="112" fill="#121824"/>
  
  <!-- Gradientes e Filtros de Iluminação -->
  <defs>
    <!-- Brilho Suave ao Redor da Carta (Reflexão/Nostalgia) -->
    <radialGradient id="backGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE3A8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#121824" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente para o Papel Envelhecido/Vintage -->
    <linearGradient id="vintagePaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1"/>
      <stop offset="60%" stop-color="#EAD5A6"/>
      <stop offset="100%" stop-color="#CBB179"/>
    </linearGradient>

    <!-- Gradiente para a Sombra das Dobras do Envelope -->
    <linearGradient id="paperShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Gradiente Profundo para o Lacre de Cera Vermelha -->
    <linearGradient id="waxSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D92B3A"/>
      <stop offset="40%" stop-color="#9E1321"/>
      <stop offset="100%" stop-color="#5E050D"/>
    </linearGradient>
  </defs>

  <!-- Aplicação do Brilho de Fundo -->
  <circle cx="256" cy="256" r="220" fill="url(#backGlow)"/>

  <!-- CORPO DO ENVELOPE (Ligeiramente rotacionado para dar um ar mais orgânico/emotivo) -->
  <g transform="rotate(-5, 256, 256) translate(0, -10)">
    
    <!-- Base do Envelope Antigo -->
    <rect x="96" y="160" width="320" height="212" rx="16" fill="url(#vintagePaper)" stroke="#5C4B31" stroke-width="3"/>
    
    <!-- Dobra Inferior do Envelope (Triângulo que sobe) -->
    <path d="M 96,372 L 256,260 L 416,372 Z" fill="url(#vintagePaper)" stroke="#5C4B31" stroke-width="2"/>
    <!-- Sombra para dar profundidade à dobra inferior -->
    <path d="M 96,372 L 256,260 L 416,372 Z" fill="url(#paperShadow)"/>

    <!-- Dobras Laterais do Envelope -->
    <path d="M 96,162 L 210,266 L 96,372 Z" fill="url(#vintagePaper)" stroke="#5C4B31" stroke-width="2"/>
    <path d="M 416,162 L 302,266 L 416,372 Z" fill="url(#vintagePaper)" stroke="#5C4B31" stroke-width="2"/>

    <!-- Dobra Superior (Flap apontando para baixo, encontrando o lacre) -->
    <path d="M 96,160 L 256,266 L 416,160 Z" fill="url(#vintagePaper)" stroke="#5C4B31" stroke-width="3"/>
    <path d="M 96,160 L 256,266 L 416,160 Z" fill="url(#paperShadow)"/>

    <!-- O LACRE DE CERA (Guardião do Segredo) -->
    <g transform="translate(256, 262)">
      <!-- Formato Irregular/Orgânico da Cera Derretida (Camada Externa) -->
      <path d="M -42,-12 C -45,-32 -25,-45 -2,-42 C 22,-39 45,-42 42,-15 C 39,12 44,38 18,42 C -8,46 -24,42 -36,25 C -48,8 -39,8 -42,-12 Z" fill="url(#waxSeal)" stroke="#3D0005" stroke-width="2"/>
      
      <!-- Círculo Interno do Sinete (Onde fica a estampa) -->
      <circle cx="0" cy="0" r="26" fill="url(#waxSeal)" stroke="#3D0005" stroke-width="1.5"/>
      
      <!-- Detalhe Gravado na Cera: Ícone de uma Fechadura / Olho da Fechadura Símbolo de Segredo -->
      <g transform="scale(0.8) translate(0, -2)">
        <circle cx="0" cy="-6" r="8" fill="none" stroke="#FF8A95" stroke-width="4" opacity="0.8"/>
        <path d="M -5,-6 L 5,-6 L 9,16 L -9,16 Z" fill="#FF8A95" opacity="0.8"/>
      </g>
      
      <!-- Brilho de Luz na Cera para dar Volumetria -->
      <path d="M -22,-22 C -15,-30 -2,-28 -2,-28" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    </g>
  </g>

  <!-- Pequenas Partículas de Pensamento Flutuando no Ar -->
  <circle cx="120" cy="110" r="5" fill="#FFE3A8" opacity="0.5"/>
  <circle cx="400" cy="420" r="4" fill="#FFE3A8" opacity="0.4"/>
</svg>
